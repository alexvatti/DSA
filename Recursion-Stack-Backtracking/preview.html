<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Recursion · Stack · Backtracking — Interactive Course</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1d2433;--mut:#667085;--ac:#4f46e5;--bd:#e3e6ef;--ok:#d1fae5;--okb:#10b981;--warn:#fef3c7;--warnb:#f59e0b;--bad:#fee2e2;--badb:#ef4444;--code:#0f172a;--codefg:#e2e8f0;--cur:rgba(250,204,21,.22);--curb:#facc15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2e;--fg:#e6e9f5;--mut:#9aa3b8;--ac:#8b86ff;--bd:#2a3050;--ok:#064e3b;--warn:#78350f;--bad:#7f1d1d}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--fg:#e6e9f5;--mut:#9aa3b8;--ac:#8b86ff;--bd:#2a3050;--ok:#064e3b;--warn:#78350f;--bad:#7f1d1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
a{color:var(--ac)}
code{background:rgba(127,127,160,.16);padding:1px 6px;border-radius:5px;font-size:.92em}
h1{margin:.2rem 0;font-size:1.9rem}h2{margin:0 0 8px;font-size:1.25rem}h3{margin:0 0 6px;font-size:1rem}
.mut,.subt{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin:16px 0}
.hero{text-align:center;padding:28px 0 4px}
.topbar{display:flex;gap:14px;align-items:center;padding:14px 0 0;font-size:.92rem;flex-wrap:wrap}.spacer{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--bd);border-radius:20px;padding:1px 11px;font-size:.84rem;background:var(--card)}
.chip.lv{background:var(--ok)}.chip.lc{background:var(--warn);text-decoration:none;color:var(--fg)}
pre{background:var(--code);color:var(--codefg);padding:14px;border-radius:10px;overflow-x:auto;font-size:.88rem;line-height:1.55;margin:8px 0 0}
pre code{background:none;padding:0;font-size:inherit}
pre.ex{background:rgba(127,127,160,.12);color:var(--fg)}
.kw{color:#c4b5fd}.fn{color:#7dd3fc}.st{color:#86efac}.cm{color:#94a3b8;font-style:italic}.nm{color:#fcd34d}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.tab{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;text-align:left}
.tab small{display:block;color:var(--mut);font-size:.72rem}.tab.active{background:var(--ac);color:#fff;border-color:var(--ac)}.tab.active small{color:#e0e0ff}
.inputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ibtn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:5px 12px;border-radius:8px;cursor:pointer;font:inherit}.ibtn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.idea{border-left:4px solid var(--ac);background:rgba(79,70,229,.07);border-radius:8px;padding:8px 14px;margin:0 0 10px}
.need{border-left:4px solid var(--warnb);background:var(--warn);border-radius:8px;padding:6px 14px;margin:0 0 10px;font-size:.92rem}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}.btn.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.controls input[type=range]{flex:1;min-width:120px}.cnt{font-size:.88rem;color:var(--mut);white-space:nowrap}
.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.work{grid-template-columns:1fr}}
.code{background:var(--code);color:var(--codefg);border-radius:10px;padding:8px 0;font:.86rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.cl{display:flex;white-space:pre;padding:0 12px 0 0;border-left:4px solid transparent}.cl .ln{width:34px;text-align:right;color:#64748b;padding-right:12px;user-select:none;flex:none}
.cl .tx{white-space:pre}
.cl.cur{background:var(--cur);border-left-color:var(--curb)}
.panel{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.panel h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.vars{width:100%;border-collapse:collapse;font:.88rem ui-monospace,Menlo,Consolas,monospace}.vars td{padding:2px 6px;border-bottom:1px dashed var(--bd)}.vars td:first-child{color:var(--mut);width:38%}
.vars tr.chg td:last-child{background:var(--warn);font-weight:700;border-radius:4px}
.dim{color:var(--mut);font-size:.88rem}
.stks{display:flex;gap:12px;flex-wrap:wrap}.stk{min-width:120px}.stk h4{margin:0 0 4px;font-size:.8rem;color:var(--ac)}
.item{border:2px solid var(--ac);border-radius:8px;padding:2px 10px;margin-bottom:4px;font:.88rem ui-monospace,Menlo,Consolas,monospace;background:var(--card)}
.item.top{background:var(--ok);border-color:var(--okb)}.item.top::after{content:"  ◀ top";color:var(--mut);font-size:.72rem}
.item.call{border-color:var(--warnb)}.item.call.top{background:var(--warn)}
.ops{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.op{font:.8rem ui-monospace,Menlo,Consolas,monospace;border-radius:6px;padding:1px 8px}.op.push{background:var(--ok)}.op.pop{background:var(--bad)}
.now{font:.9rem ui-monospace,Menlo,Consolas,monospace;min-height:1.5em}
.res{margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--ok);font-weight:700}
.log{max-height:150px;overflow-y:auto;font:.8rem ui-monospace,Menlo,Consolas,monospace;border-left:3px solid var(--bd);padding-left:10px;color:var(--mut)}.log .cur{color:var(--fg);font-weight:700}
table.cmp{border-collapse:collapse;width:100%;margin-top:10px;font-size:.92rem}.cmp th,.cmp td{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}.cmp th{background:rgba(127,127,160,.12)}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.way,.prob{border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:12px 0}
.probs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.prob{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}.prob:hover{border-color:var(--ac)}
.num{background:var(--ac);color:#fff;border-radius:8px;padding:2px 9px;font-weight:700}.pt{flex:1;display:flex;flex-direction:column}.pt small{color:var(--mut)}.lv{font-size:.76rem;background:var(--ok);border-radius:20px;padding:1px 9px;white-space:nowrap}
footer{text-align:center;color:var(--mut);font-size:.88rem;margin-top:22px}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

</style>
</head>

const HUB = "\n<header class=\"hero\">\n  <h1>🧭 Recursion · Stack · Backtracking</h1>\n  <p class=\"subt\">10 basic problems, each solved <strong>4 ways</strong>. Step through every line and watch the stacks move. Goal: jump into LeetCode recursion / backtracking problems with confidence.</p>\n</header>\n\n<section class=\"card\" id=\"stack\">\n  <h2>📦 Step 0 — Our own Stack (base code, written ONCE)</h2>\n  <p>You already know stacks. This is the only stack we use in methods 3 and 4. Whenever a problem says <em>“our own stack”</em>, <strong>refer back to this code</strong> (file: <code>code/stack_base.py</code>).</p>\n<pre class=\"codeblock\"><span class=\"kw\">class</span> Stack:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self):\n        self.items = []                 <span class=\"cm\"># the end of the list is the TOP</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">push</span>(self, x):                  <span class=\"cm\"># put x on the TOP</span>\n        self.items.append(x)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">pop</span>(self):                      <span class=\"cm\"># remove and return the TOP</span>\n        <span class=\"kw\">return</span> self.items.pop()\n\n    <span class=\"kw\">def</span> <span class=\"fn\">peek</span>(self):                     <span class=\"cm\"># look at the TOP, do not remove</span>\n        <span class=\"kw\">return</span> self.items[-<span class=\"nm\">1</span>]\n\n    <span class=\"kw\">def</span> <span class=\"fn\">is_empty</span>(self):                 <span class=\"cm\"># True when nothing is inside</span>\n        <span class=\"kw\">return</span> len(self.items) == <span class=\"nm\">0</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">size</span>(self):\n        <span class=\"kw\">return</span> len(self.items)</pre>\n  <p class=\"mut\"><code>push(x)</code> puts x on top • <code>pop()</code> removes and returns the top • <code>is_empty()</code> tells if nothing is inside. In the code files: <code>from stack_base import Stack</code></p>\n</section>\n\n<section class=\"card\">\n  <h2>🧩 The 4 ways (same answer every time)</h2>\n  <div class=\"four\">\n    <div class=\"way\"><h3>🔁 1 · Loop</h3><p>Plain <code>for</code> / <code>while</code> with variables.</p></div>\n    <div class=\"way\"><h3>🔂 2 · Recursion</h3><p>The function calls itself. <strong>Python</strong> keeps the pending work on its <em>call stack</em>.</p></div>\n    <div class=\"way\"><h3>📚 3 · Recursion + our own Stack</h3><p>We do what Python does: <strong>push</strong> pending work going down, <strong>pop</strong> it coming up.</p></div>\n    <div class=\"way\"><h3>🧭 4 · Own Stack + Backtracking</h3><p>One loop, items are <code>(state, \"go\" / \"back\")</code>. <em>go</em> = enter / choose, <em>back</em> = leave / undo. <strong>The LeetCode template.</strong></p></div>\n  </div>\n  <div class=\"two\">\n    <div><h3>Template for method 3</h3><pre class=\"codeblock\">stack = Stack()\n<span class=\"kw\">while</span> &lt;going DOWN&gt;:            <span class=\"cm\"># push every pending piece of work</span>\n    stack.push(piece)\nresult = &lt;base case&gt;\n<span class=\"kw\">while</span> <span class=\"kw\">not</span> stack.is_empty():    <span class=\"cm\"># coming UP: pop and finish the work</span>\n    result = combine(result, stack.pop())</pre></div>\n    <div><h3>Template for method 4</h3><pre class=\"codeblock\">stack = Stack()\nstack.push((start, <span class=\"st\">\"go\"</span>))\n<span class=\"kw\">while</span> <span class=\"kw\">not</span> stack.is_empty():\n    state, phase = stack.pop()\n    <span class=\"kw\">if</span> phase == <span class=\"st\">\"go\"</span>:                      <span class=\"cm\"># ENTER  (choose)</span>\n        <span class=\"kw\">if</span> &lt;base case&gt;:\n            &lt;record the answer&gt;\n        <span class=\"kw\">else</span>:\n            stack.push((state, <span class=\"st\">\"back\"</span>))    <span class=\"cm\"># UNDO / combine later</span>\n            <span class=\"kw\">for</span> child <span class=\"kw\">in</span> &lt;children&gt;:       <span class=\"cm\"># push so the first child comes out first</span>\n                stack.push((child, <span class=\"st\">\"go\"</span>))\n    <span class=\"kw\">else</span>:                                  <span class=\"cm\"># \"back\": LEAVE (undo / combine)</span>\n        &lt;undo the choice <span class=\"kw\">or</span> combine the answers&gt;</pre></div>\n  </div>\n  <table class=\"cmp\"><tr><th>Recursion says…</th><th>Our own stack says…</th></tr>\n    <tr><td>call a function</td><td><code>stack.push(state)</code></td></tr>\n    <tr><td>base case reached</td><td>record the answer</td></tr>\n    <tr><td>the call returns</td><td><code>stack.pop()</code> (the <code>\"back\"</code> frame)</td></tr>\n    <tr><td>undo after the recursive call</td><td>the work in the <code>\"back\"</code> phase</td></tr>\n    <tr><td>RecursionError (depth ≈ 1000)</td><td>no limit: the stack lives on the heap</td></tr></table>\n</section>\n\n<section class=\"card\">\n  <h2>🗺️ The 10 problems</h2>\n  <p class=\"mut\">Each page: problem • 4 method tabs • code with the current line highlighted • live <em>Variables / Call stack / Our Stack</em> panels • Prev / Play / Next.</p>\n  <div class=\"probs\"><a class=\"prob\" href=\"#01-factorial\"><span class=\"num\">01</span><span class=\"pt\"><b>Factorial</b><small>Linear recursion (1 branch)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#02-fibonacci\"><span class=\"num\">02</span><span class=\"pt\"><b>Fibonacci</b><small>Tree recursion (2 branches)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#03-sum-of-digits\"><span class=\"num\">03</span><span class=\"pt\"><b>Sum of Digits</b><small>Linear recursion (1 branch)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#04-reverse-number\"><span class=\"num\">04</span><span class=\"pt\"><b>Reverse a Number</b><small>Linear recursion (1 branch)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#05-palindrome-number\"><span class=\"num\">05</span><span class=\"pt\"><b>Palindrome Number</b><small>Two-ended check</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#06-power\"><span class=\"num\">06</span><span class=\"pt\"><b>Power  x ^ n</b><small>Linear recursion (1 branch)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#07-reverse-string\"><span class=\"num\">07</span><span class=\"pt\"><b>Reverse a String</b><small>Linear recursion (1 branch)</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#08-numbers-1-to-n\"><span class=\"num\">08</span><span class=\"pt\"><b>Numbers 1 to N  (before vs after)</b><small>Work BEFORE vs AFTER the call</small></span><span class=\"lv\">Basic</span></a>\n<a class=\"prob\" href=\"#09-binary-strings\"><span class=\"num\">09</span><span class=\"pt\"><b>Binary Strings of Length n</b><small>Backtracking: choose / explore / undo</small></span><span class=\"lv\">Backtracking intro</span></a>\n<a class=\"prob\" href=\"#10-subsets\"><span class=\"num\">10</span><span class=\"pt\"><b>Subsets</b><small>Backtracking: choose / explore / undo</small></span><span class=\"lv\">LeetCode 78 · Medium</span></a></div>\n</section>\n\n<section class=\"card\">\n  <h2>🚀 Then jump to LeetCode</h2>\n  <p>Start with <strong>509 Fibonacci</strong>, <strong>70 Climbing Stairs</strong>, <strong>344 Reverse String</strong>, <strong>7 Reverse Integer</strong>, <strong>9 Palindrome Number</strong>, <strong>50 Pow(x, n)</strong>, then the backtracking family: <strong>78 Subsets</strong>, <strong>46 Permutations</strong>, <strong>17 Letter Combinations</strong>, <strong>22 Generate Parentheses</strong>, <strong>39 Combination Sum</strong>. For each one write method 2 first (recursion), then convert it to method 4 using the template above.</p>\n</section>\n<footer>Files: <code>pages/</code> (web pages) • <code>notes/</code> (md) • <code>code/</code> (py, run with <code>python3 NN_name.py</code>)</footer>\n";
/* Shared page engine: reads window.PROBLEM (made by the build script from real sys.settrace runs of the real code) */
function mount(P) {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const hl = line => esc(line).replace(/(#.*$)|("[^"]*")|\b(def|class|while|if|elif|else|return|is|not|and|or|None|True|False|for|in|break)\b|\b(\d+)\b|(?<=def )(\w+)/g,
    (m, c, s, k, n, f) => c ? `<span class="cm">${c}</span>` : s ? `<span class="st">${s}</span>` : k ? `<span class="kw">${k}</span>` : n ? `<span class="nm">${n}</span>` : `<span class="fn">${f}</span>`);
  const M = [
    { icon: '🔁', name: 'Loop', sub: 'for / while', stack: false },
    { icon: '🔂', name: 'Recursion', sub: 'function calls itself', stack: false },
    { icon: '📚', name: 'Recursion + own Stack', sub: 'push down, pop up', stack: true },
    { icon: '🧭', name: 'Own Stack + Backtracking', sub: '(state, go / back)', stack: true }
  ];
  const S = { inp: 0, m: 0, step: [0, 0, 0, 0], timer: null };
  const link = (l, u, c) => `<a class="chip ${c}" href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`;

  $('#app').innerHTML = `
    <div class="topbar"><a href="#home">← All problems</a><a href="#stack">📦 Our Stack (base code)</a><span class="spacer"></span>
      ${P.prev ? `<a href="#${P.prev}">← ${esc(P.prevTitle)}</a>` : ''}${P.next ? `<a href="#${P.next}">${esc(P.nextTitle)} →</a>` : ''}</div>
    <h1>${P.id} · ${esc(P.title)}</h1>
    <div class="chips"><span class="chip lv">${esc(P.diff)}</span><span class="chip">${esc(P.tag)}</span>
      ${P.lc.map(x => link('🔗 ' + x[0], x[1], 'lc')).join('')}</div>
    <section class="card"><h2>📝 Problem</h2><p>${esc(P.statement)}</p><pre class="ex">${esc(P.examples.join('\n'))}</pre></section>
    <section class="card"><div class="inputs"><b>Try it with:</b><span id="inputs"></span><span class="dim">(the page replays a real run of the real code)</span></div></section>
    <nav class="tabs" id="tabs"></nav>
    <section class="card" id="method"></section>
    <section class="card"><h2>⚖️ The 4 ways side by side</h2>
      <table class="cmp"><tr><th>Method</th><th>Extra memory</th><th>Weak spot</th></tr>
      <tr><td>🔁 Loop</td><td>O(1) variables</td><td>awkward for tree-shaped problems (subsets, permutations)</td></tr>
      <tr><td>🔂 Recursion</td><td>Python’s call stack, O(depth)</td><td>RecursionError at depth ≈ 1000</td></tr>
      <tr><td>📚 Recursion + own stack</td><td>our Stack, O(depth)</td><td>more code than recursion</td></tr>
      <tr><td>🧭 Own stack + backtracking</td><td>our Stack, O(depth)</td><td>most code — but no depth limit, and it is the template for every LeetCode backtracking problem</td></tr></table>
      <p class="idea" style="margin-top:12px">💡 <b>Takeaway:</b> ${esc(P.takeaway)}</p>
      ${P.related.length ? `<p><b>🚀 Next on LeetCode:</b> ${P.related.map(x => link(x[0], x[1], 'lc')).join(' ')}</p>` : ''}</section>`;

  $('#inputs').innerHTML = P.methods[0].runs.map((r, i) => `<button class="ibtn" data-i="${i}">${esc(r.label)}</button>`).join(' ');
  $('#tabs').innerHTML = M.map((m, i) => `<button class="tab" data-m="${i}">${m.icon} ${i + 1} · ${m.name}<small>${m.sub}</small></button>`).join('');
  $('#inputs').onclick = e => { const b = e.target.closest('[data-i]'); if (b) { stop(); S.inp = +b.dataset.i; S.step = [0, 0, 0, 0]; render(); } };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { stop(); S.m = +b.dataset.m; render(); } };

  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; const b = $('#play'); if (b) b.textContent = '▶ Play'; } }
  const run = () => P.methods[S.m].runs[S.inp];

  function render() {
    document.querySelectorAll('.ibtn').forEach(b => b.classList.toggle('active', +b.dataset.i === S.inp));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', +b.dataset.m === S.m));
    const m = P.methods[S.m], mm = M[S.m], n = run().frames.length;
    $('#method').innerHTML = `
      <div class="idea">${mm.icon} <b>${mm.name}.</b> ${esc(m.idea)}</div>
      ${mm.stack ? `<div class="need">📦 This method uses <b>our own Stack</b> — refer to the <a href="#stack">base code</a> (<code>push</code>, <code>pop</code>, <code>is_empty</code>).</div>` : ''}
      <div class="controls"><button class="btn" id="prev">◀ Prev</button><button class="btn primary" id="play">▶ Play</button><button class="btn" id="next">Next ▶</button><button class="btn" id="reset">⟲ Reset</button>
        <input type="range" id="sl" min="0" max="${n - 1}" value="0"><span class="cnt" id="cnt"></span></div>
      <div class="work">
        <div class="code" id="code">${m.code.split('\n').map((l, i) => `<div class="cl"><span class="ln">${i + 1}</span><span class="tx">${hl(l) || ' '}</span></div>`).join('')}</div>
        <div>
          <div class="panel"><h3>▶ Next line to run</h3><div class="now" id="now"></div><div class="ops" id="ops"></div></div>
          <div class="panel"><h3>Variables</h3><div id="vars"></div></div>
          <div class="panel"><h3>${S.m === 1 ? 'Python call stack (recursion)' : 'Call stack'}</h3><div id="calls"></div></div>
          <div class="panel"><h3>Our own Stack</h3><div id="stks"></div></div>
          <div id="res"></div>
        </div></div>
      <div class="panel" style="margin-top:10px"><h3>Step log</h3><div class="log" id="log"></div></div>`;
    $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1); $('#reset').onclick = () => { stop(); S.step[S.m] = 0; update(); };
    $('#sl').oninput = e => { stop(); S.step[S.m] = +e.target.value; update(); };
    $('#play').onclick = () => {
      if (S.timer) return stop();
      if (S.step[S.m] >= n - 1) S.step[S.m] = 0;
      $('#play').textContent = '⏸ Pause';
      S.timer = setInterval(() => { if (S.step[S.m] < n - 1) { S.step[S.m]++; update(); } else stop(); }, 750);
      update();
    };
    update();
  }
  function go(d) { stop(); const n = run().frames.length; S.step[S.m] = Math.max(0, Math.min(n - 1, S.step[S.m] + d)); update(); }

  function update() {
    const r = run(), F = r.frames, i = S.step[S.m], f = F[i], pv = F[i - 1];
    document.querySelectorAll('#code .cl').forEach((el, k) => el.classList.toggle('cur', k + 1 === f.l));
    $('#sl').value = i; $('#cnt').textContent = `Step ${i + 1} / ${F.length}`;
    $('#now').textContent = f.n;
    $('#ops').innerHTML = f.o.map(o => `<span class="op ${o.startsWith('push') ? 'push' : 'pop'}">${o.startsWith('push') ? '↓' : '↑'} ${esc(o)}</span>`).join('');
    const ents = Object.entries(f.v);
    $('#vars').innerHTML = ents.length ? `<table class="vars">${ents.map(([k, v]) => `<tr class="${pv && pv.v[k] !== v ? 'chg' : ''}"><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : '<span class="dim">(none yet)</span>';
    $('#calls').innerHTML = S.m === 1
      ? [...f.c].reverse().map((c, k) => `<div class="item call ${k === 0 ? 'top' : ''}">${esc(c)}</div>`).join('')
      : '<span class="dim">Only one function runs, so there is no call stack to watch.</span>';
    $('#stks').innerHTML = M[S.m].stack
      ? `<div class="stks">${f.s.map(([nm, items]) => `<div class="stk"><h4>${esc(nm)}</h4>${items.length ? [...items].reverse().map((x, k) => `<div class="item ${k === 0 ? 'top' : ''}">${esc(x)}</div>`).join('') : '<span class="dim">(empty)</span>'}</div>`).join('') || '<span class="dim">(not created yet)</span>'}</div>`
      : '<span class="dim">This method does not use our own Stack.</span>';
    $('#res').innerHTML = i === F.length - 1 ? `<div class="res">✅ Result = ${esc(r.result)}</div>` : '';
    const from = Math.max(0, i - 7);
    $('#log').innerHTML = F.slice(from, i + 1).map((x, k) => `<div class="${from + k === i ? 'cur' : ''}">${from + k + 1}. ${esc(x.n)}${x.o.length ? '   [' + esc(x.o.join(', ')) + ']' : ''}</div>`).join('');
  }
  if (window.__kd) document.removeEventListener('keydown', window.__kd);
  window.__kd = e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); };
  document.addEventListener('keydown', window.__kd);
  window.__stop = stop; window.scrollTo(0, 0);
  render();
}
function route() {
  const h = location.hash.slice(1);
  if (window.__stop) window.__stop();
  if (ALL[h]) return mount(ALL[h]);
  document.getElementById('app').innerHTML = HUB;
  if (h === 'stack') document.getElementById('stack').scrollIntoView(); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
